<svg xmlns="http://www.w3.org/2000/svg" width="800" height="300" viewBox="0 0 800 300" role="img" aria-labelledby="title desc">
  <title id="title">Unshort terminal preview</title>
  <desc id="desc">A dark terminal mockup showing Unshort resolving a placeholder Linkvertise path into a placeholder destination URL.</desc>

  <rect width="800" height="300" rx="16" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="799" height="299" rx="15.5" fill="none" stroke="#30363d"/>

  <g aria-hidden="true">
    <circle cx="22" cy="22" r="5" fill="#ff5f57"/>
    <circle cx="40" cy="22" r="5" fill="#ffbd2e"/>
    <circle cx="58" cy="22" r="5" fill="#28c840"/>
    <text x="400" y="27" text-anchor="middle" fill="#8b949e" font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="13">unshort.py</text>
    <line x1="0" y1="42" x2="800" y2="42" stroke="#30363d"/>
  </g>

  <g font-family="Consolas, 'SFMono-Regular', 'Liberation Mono', Menlo, monospace" font-size="18">
    <text x="30" y="78">
      <tspan fill="#bc8cff" font-weight="700">*</tspan><tspan fill="#f0f6fc">  </tspan><tspan fill="#f0f6fc" font-weight="700">Unshort</tspan><tspan fill="#8b949e"> - </tspan><tspan fill="#d29922">user/abc123</tspan>
    </text>

    <text x="30" y="112">
      <tspan fill="#8b949e">|</tspan><tspan fill="#f0f6fc">  </tspan><tspan fill="#8b949e">Launching browser</tspan><tspan fill="#f0f6fc"> </tspan><tspan fill="#3fb950" font-weight="700">OK</tspan>
    </text>

    <text x="30" y="146">
      <tspan fill="#8b949e">|</tspan><tspan fill="#f0f6fc">  </tspan><tspan fill="#8b949e">Resolving</tspan><tspan fill="#f0f6fc"> </tspan><tspan fill="#3fb950" font-weight="700">OK</tspan>
    </text>

    <text x="30" y="180">
      <tspan fill="#8b949e">|</tspan><tspan fill="#f0f6fc">  </tspan><tspan fill="#8b949e">cool-stuff.zip - cdn.example.com</tspan>
    </text>

    <text x="30" y="214">
      <tspan fill="#8b949e">|</tspan><tspan fill="#f0f6fc">  </tspan><tspan fill="#39c5cf" font-weight="700">Bypassing</tspan><tspan fill="#8b949e"> . 1/3 2/3 3/3 </tspan><tspan fill="#3fb950" font-weight="700">OK</tspan>
    </text>

    <text x="30" y="254">
      <tspan fill="#3fb950" font-weight="700">OK</tspan><tspan fill="#f0f6fc">  </tspan><tspan fill="#f0f6fc" font-weight="700">https://example.com/file/abc123</tspan>
    </text>

    <text x="30" y="282" fill="#8b949e">Done in 8.71s</text>
  </g>
</svg>
